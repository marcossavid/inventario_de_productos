<!DOCTYPE html>
<html>
<head>
    <title>My Store</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../../assets/css/styles.css">
    <link rel="stylesheet" type="text/css" href="../../assets/css/header.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="../../views/home.html">Home</a></li>
                <li><a href="lista_categorias.html">Lista Categorias</a></li>
            </ul>
        </nav>
    </header>
   
    <form id="form-productos" action="../productos.php" method="POST" enctype="multipart/form-data">
        <h3>Alta de Productos</h3>
        
        <label>Nombre del Producto</label>
        <input type="text" name="nombre" required>

        <label>Código SKU</label>
        <input type="text" name="sku" placeholder="Ej: REM-NEGRA-L, ACC-001" required>

        <label>Imagen</label>
        <input type="file" name="imagen" required>

        <label>Cantidad (Stock)</label>
        <input type="number" name="cantidad" min="0" value="0" required>

        <label for="categoria">Categoría:</label>
        <select name="categoria" id="categoria" required style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            <option value="">Cargando categorías...</option>
        </select>
        
        <label>Precio</label>
        <input type="number" name="precio" required>

        <button type="submit">Guardar</button>
    </form>
    <div>Autor Marcos Savid</div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="../../assets/js/validaciones.js" type="text/javascript"></script>
    
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Le pedimos la lista de categorías al backend
        fetch('../productos.php')
            .then(response => response.json())
            .then(categorias => {
                const select = document.getElementById('categoria');
                select.innerHTML = '<option value="">Seleccione una categoría</option>';
                
                if (categorias.length > 0) {
                    categorias.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat.id;          
                        option.textContent = cat.nombre; 
                        select.appendChild(option);
                    });
                } else {
                    select.innerHTML = '<option value="">No hay categorías creadas aún</option>';
                }
            })
            .catch(error => {
                console.error('Error al cargar categorías:', error);
                document.getElementById('categoria').innerHTML = '<option value="">Error al cargar categorías</option>';
            });
    });
    </script>
</body>
</html>
