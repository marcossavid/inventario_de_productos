<!DOCTYPE html>
<html>
<head>
    <title>My Store</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../../assets/css/styles.css">
    <link rel="stylesheet" type="text/css" href="../../assets/css/header.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="../../views/home.html">Home</a></li>
                <li><a href="lista_categorias.html">Lista Categorias</a></li>
            </ul>
        </nav>
    </header>
   
   <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow-sm">
                <form id="form-productos" action="../productos.php" method="POST" enctype="multipart/form-data">
    <h3 class="mb-4">Alta de Productos</h3>
    
    <div class="mb-3">
        <label class="form-label">Nombre del Producto</label>
        <input type="text" name="nombre" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Código SKU</label>
        <input type="text" name="sku" class="form-control" placeholder="Ej: REM-NEGRA-L" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Imagen</label>
        <input type="file" name="imagen" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Cantidad (Stock)</label>
        <input type="number" name="cantidad" class="form-control" min="0" value="0" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoría:</label>
        <select name="categoria" id="categoria" class="form-select" required>
            <option value="">Cargando categorías...</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Precio</label>
        <input type="number" name="precio" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Guardar</button>
</form>
            </div>
        </div>
    </div>
</div>
    <div>Autor Marcos Savid</div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="../../assets/js/validaciones.js" type="text/javascript"></script>
    
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Le pedimos la lista de categorías al backend
        fetch('../productos.php')
            .then(response => response.json())
            .then(categorias => {
                const select = document.getElementById('categoria');
                select.innerHTML = '<option value="">Seleccione una categoría</option>';
                
                if (categorias.length > 0) {
                    categorias.forEach(cat => {
                        const option = document.createElement('option');
                        option.value = cat.id;          
                        option.textContent = cat.nombre; 
                        select.appendChild(option);
                    });
                } else {
                    select.innerHTML = '<option value="">No hay categorías creadas aún</option>';
                }
            })
            .catch(error => {
                console.error('Error al cargar categorías:', error);
                document.getElementById('categoria').innerHTML = '<option value="">Error al cargar categorías</option>';
            });
    });
    </script>
</body>
</html>
