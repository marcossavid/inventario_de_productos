      <script>
document.addEventListener("DOMContentLoaded", function() {
    // Le pedimos la lista de categorías al backend (está una carpeta arriba '../')
    fetch('../productos.php')
        .then(response => response.json())
        .then(categorias => {
            const select = document.getElementById('categoria');
            select.innerHTML = '<option value="">Seleccione una categoría</option>';
            
            if (categorias.length > 0) {
                // Recorremos las categorías que trajo la base de datos
                categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;          // Por detrás guarda el ID numérico (ej: 1)
                    option.textContent = cat.nombre; // En pantalla muestra el texto (ej: "Plantas y Paisajes")
                    select.appendChild(option);
                });
            } else {
                select.innerHTML = '<option value="">No hay categorías creadas aún</option>';
            }
        })
        .catch(error => {
            console.error('Error al cargar categorías:', error);
            document.getElementById('categoria').innerHTML = '<option value="">Error al cargar categorías</option>';
        });
});
</script>
