<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Costos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
     <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="stylesheet" type="text/css" href="../../assets/css/header.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .chart-container {
            position: relative; 
            height: 500px; 
            width: 100%;
        }
    </style>
</head>
<body class="bg-light">
    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="../../views/home.html">Home</a></li>
                <li><a href="lista_categorias.html">Lista Categorias</a></li>
                <li><a href="#" style="text-decoration: underline;">Reportes</a></li>
            </ul>
        </nav>
    </header>

    <div class="container mt-5">
        <h2 class="mb-4">Reporte de Inversión por Categoría</h2>
        
        <select id="filtro-grafico" class="form-select mb-4" style="max-width: 300px;">
            <option value="todas">Ver todas las categorías</option>
        </select>
        <h4 id="suma-total" class="mt-4 text-primary"></h4>
        <div class="card p-4 chart-container">
            <canvas id="miGrafico"></canvas>
        </div>
        
    </div>
    <script>
        let productos = [];
        let miChart;

        $(document).ready(function () {
            $.ajax({
                url: '../../backend/productos.php',
                method: 'GET',
                data: { action: 'listarHome' },
                success: function (data) {
                    productos = data;
                    cargarFiltro();
                    actualizarGrafico('todas');
                }
            });

            function cargarFiltro() {
                const categorias = [...new Set(productos.map(p => p.categoria))];
                categorias.forEach(cat => {
                    $('#filtro-grafico').append(`<option value="${cat}">${cat}</option>`);
                });
            }

            $('#filtro-grafico').on('change', function() {
                actualizarGrafico($(this).val());
            });

            function actualizarGrafico(filtro) {
                let labels = [], data = [], total = 0;

                if (filtro === 'todas') {
                    let mapTotales = {};
                    productos.forEach(p => {
                        let costo = p.precio * p.cantidad;
                        mapTotales[p.categoria] = (mapTotales[p.categoria] || 0) + parseFloat(costo);
                    });
                    labels = Object.keys(mapTotales);
                    data = Object.values(mapTotales);
                } else {
                    const filtrados = productos.filter(p => p.categoria === filtro);
                    labels = filtrados.map(p => p.nombre);
                    data = filtrados.map(p => p.precio * p.cantidad);
                }

                total = data.reduce((a, b) => a + b, 0);
                $('#suma-total').text("Inversión Total: $" + total.toFixed(2));

                if (miChart) miChart.destroy();
                miChart = new Chart(document.getElementById('miGrafico'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Costo Total ($)',
                            data: data,
                            backgroundColor: '#0d6efd'
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { beginAtZero: true }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
